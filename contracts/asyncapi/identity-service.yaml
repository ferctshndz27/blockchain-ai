asyncapi: 3.1.0
info:
  title: identity-service — eventos
  version: 0.1.0
  description: |
    v0 — Hechos de tenancy que publica identity-service: organizaciones, configuración del
    tenant (zona horaria, moneda), nivel de autonomía L0–L3 y membresías. Consume los
    webhooks crudos del IdP (altas y bajas de usuarios) publicados por webhook-ingress.

    - Envoltura CloudEvents 1.0 en modo binario (cabeceras `ce_*`).
    - Key de Kafka = organizationId en eventos de organización y memberId en MemberChanged;
      providerEventId en el topic de ingreso.
    - Publicación con outbox transaccional; consumo idempotente con inbox (`ce_id`) y, en el
      ingreso, UNIQUE (provider, provider_event_id).
    - Sin datos personales en el payload: solo ids, estados, niveles y fechas; el nombre del
      tenant y los detalles de la membresía se re-sincronizan con la API REST
      (contracts/openapi/identity-service.yaml).
defaultContentType: application/json

servers:
  production:
    host: kafka.receivables.internal:9098
    protocol: kafka-secure
    description: Kafka gestionado con TLS y autenticación IAM/SASL; ACL por servicio.

channels:
  identityEvents:
    address: identity.events.v1
    description: Hechos de tenancy, configuración y membresías. Productor único — identity-service.
    messages:
      OrganizationCreated:
        $ref: '#/components/messages/OrganizationCreated'
      OrganizationSettingsChanged:
        $ref: '#/components/messages/OrganizationSettingsChanged'
      AutonomyLevelChanged:
        $ref: '#/components/messages/AutonomyLevelChanged'
      MemberChanged:
        $ref: '#/components/messages/MemberChanged'
    bindings:
      kafka:
        partitions: 12
        replicas: 3
        bindingVersion: '0.5.0'

  idpIngress:
    address: ingress.idp.v1
    description: Webhooks crudos del IdP (altas y bajas de usuarios; payload del proveedor, retención 3 días). Productor — webhook-ingress; ACL solo para identity-service.
    messages:
      IdpIngress:
        $ref: '#/components/messages/IdpIngress'
    bindings:
      kafka:
        partitions: 12
        replicas: 3
        bindingVersion: '0.5.0'

operations:
  publishIdentityEvents:
    action: send
    channel:
      $ref: '#/channels/identityEvents'
    summary: identity-service publica los hechos de tenancy mediante su outbox.

  receiveIdpIngress:
    action: receive
    channel:
      $ref: '#/channels/idpIngress'
    summary: |
      Aplica altas y bajas de usuarios del IdP: crea o actualiza la membresía (sincronía de
      estado) y publica MemberChanged. Resuelve el tenant vía organización del IdP (§7.6).
    bindings:
      kafka:
        groupId:
          type: string
          enum: [identity-service]
        bindingVersion: '0.5.0'

components:
  messageBindings:
    byOrganizationId:
      kafka:
        key:
          type: string
          format: uuid
          description: organizationId
        bindingVersion: '0.5.0'
    byMemberId:
      kafka:
        key:
          type: string
          format: uuid
          description: memberId
        bindingVersion: '0.5.0'
    byProviderEventId:
      kafka:
        key:
          type: string
          description: providerEventId
        bindingVersion: '0.5.0'

  messages:
    OrganizationCreated:
      name: OrganizationCreated
      title: Organización (tenant) creada
      x-ce-type: com.receivables.identity.organization-created.v1
      headers:
        $ref: '#/components/schemas/EventHeaders'
      payload:
        $ref: '#/components/schemas/OrganizationCreatedPayload'
      bindings:
        $ref: '#/components/messageBindings/byOrganizationId'
    OrganizationSettingsChanged:
      name: OrganizationSettingsChanged
      title: Cambió la configuración del tenant
      x-ce-type: com.receivables.identity.organization-settings-changed.v1
      headers:
        $ref: '#/components/schemas/EventHeaders'
      payload:
        $ref: '#/components/schemas/OrganizationSettingsChangedPayload'
      bindings:
        $ref: '#/components/messageBindings/byOrganizationId'
    AutonomyLevelChanged:
      name: AutonomyLevelChanged
      title: Cambió el nivel de autonomía (L0–L3), auditado
      x-ce-type: com.receivables.identity.autonomy-level-changed.v1
      headers:
        $ref: '#/components/schemas/EventHeaders'
      payload:
        $ref: '#/components/schemas/AutonomyLevelChangedPayload'
      bindings:
        $ref: '#/components/messageBindings/byOrganizationId'
    MemberChanged:
      name: MemberChanged
      title: Membresía creada, cambiada o removida
      x-ce-type: com.receivables.identity.member-changed.v1
      headers:
        $ref: '#/components/schemas/EventHeaders'
      payload:
        $ref: '#/components/schemas/MemberChangedPayload'
      bindings:
        $ref: '#/components/messageBindings/byMemberId'
    IdpIngress:
      name: IdpIngress
      title: Webhook crudo del IdP (propiedad de webhook-ingress)
      x-ce-type: com.receivables.ingress.idp.v1
      headers:
        $ref: '#/components/schemas/EventHeaders'
      payload:
        $ref: '#/components/schemas/IdpIngressPayload'
      bindings:
        $ref: '#/components/messageBindings/byProviderEventId'

  schemas:
    EventHeaders:
      type: object
      required: [ce_specversion, ce_id, ce_source, ce_type, ce_time, ce_tenantid, ce_correlationid]
      properties:
        ce_specversion:
          type: string
          const: '1.0'
        ce_id:
          type: string
          format: uuid
          description: Id único del mensaje (UUID v7); clave del inbox del consumidor.
        ce_source:
          type: string
          examples: [/identity-service]
        ce_type:
          type: string
          examples: [com.receivables.identity.organization-created.v1]
        ce_time:
          type: string
          format: date-time
        ce_subject:
          type: string
          examples: [organization/0192f5d2-7c1a-7b3e-9f10-2a6c1d4e8b90]
        ce_tenantid:
          type: string
          format: uuid
        ce_correlationid:
          type: string
          description: Agrupa todos los mensajes de un mismo flujo.
        ce_causationid:
          type: string
          description: ce_id del mensaje que causó este.
        traceparent:
          type: string
          description: Contexto W3C Trace Context.
        content-type:
          type: string
          const: application/json
    Uuid:
      type: string
      format: uuid
    Actor:
      type: object
      additionalProperties: false
      required: [type]
      properties:
        type:
          type: string
          enum: [HUMAN, AI, SYSTEM]
        id:
          type: string
    AutonomyLevel:
      type: string
      enum: [L0, L1, L2, L3]
      description: Coincide letra por letra con el enum autonomyLevel del schema Organization de contracts/openapi/identity-service.yaml.
    MemberStatus:
      type: string
      enum: [ACTIVE, INVITED, SUSPENDED, REMOVED]
      description: Coincide letra por letra con el enum status del schema Member de contracts/openapi/identity-service.yaml.

    OrganizationCreatedPayload:
      type: object
      additionalProperties: false
      required: [organizationId, actor, createdAt]
      properties:
        organizationId:
          $ref: '#/components/schemas/Uuid'
        actor:
          $ref: '#/components/schemas/Actor'
        createdAt:
          type: string
          format: date-time
    OrganizationSettingsChangedPayload:
      type: object
      additionalProperties: false
      required: [organizationId, changedFields, changedAt]
      properties:
        organizationId:
          $ref: '#/components/schemas/Uuid'
        changedFields:
          type: array
          minItems: 1
          items:
            type: string
            enum: [timezone, locale, currency, contactPolicy]
        timezone:
          type: string
          examples: [America/Mexico_City]
          description: Zona horaria IANA del tenant, para el tick de vencimientos y antigüedad.
        changedAt:
          type: string
          format: date-time
    AutonomyLevelChangedPayload:
      type: object
      additionalProperties: false
      required: [organizationId, from, to, actor, changedAt]
      properties:
        organizationId:
          $ref: '#/components/schemas/Uuid'
        from:
          $ref: '#/components/schemas/AutonomyLevel'
        to:
          $ref: '#/components/schemas/AutonomyLevel'
        reason:
          type: string
          maxLength: 2000
          description: Justificación obligatoria del cambio (auditada).
        actor:
          $ref: '#/components/schemas/Actor'
        changedAt:
          type: string
          format: date-time
    MemberChangedPayload:
      type: object
      additionalProperties: false
      required: [memberId, organizationId, userId, status, changedAt]
      properties:
        memberId:
          $ref: '#/components/schemas/Uuid'
        organizationId:
          $ref: '#/components/schemas/Uuid'
        userId:
          type: string
          description: Id del usuario en el IdP (no es un dato personal en sí; la identidad vive en el IdP).
        role:
          type: string
        status:
          $ref: '#/components/schemas/MemberStatus'
        changedAt:
          type: string
          format: date-time
    IdpIngressPayload:
      type: object
      additionalProperties: false
      description: Payload crudo del IdP, cifrado en reposo en el inbox de webhook-ingress.
      required: [provider, providerEventId, eventType, receivedAt, rawBody]
      properties:
        provider:
          type: string
          description: Identificador de la organización en el IdP (rutas a tenant, §7.6).
        providerEventId:
          type: string
          description: Identificador del evento en el IdP; UNIQUE (provider, provider_event_id).
        eventType:
          type: string
          description: Tipo de evento según la documentación del IdP (p. ej. user.created, user.deleted).
        receivedAt:
          type: string
          format: date-time
        rawBody:
          type: object
          additionalProperties: true
          description: Cuerpo crudo del webhook, tal como lo emitió el IdP.
