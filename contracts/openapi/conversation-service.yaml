openapi: 3.1.0
info:
  title: conversation-service API
  version: 0.1.0
  description: |
    v0 — Conversaciones, mensajes, plantillas (estado de aprobación en Meta),
    cuentas de canal y sus rutas a tenant, preferencias y opt-out por canal,
    ventana de 24 h, estados de entrega y envío idempotente.
    El opt-out por canal vive aquí (no en customer-service): se recibe por el
    canal y se aplica al enviar, así que su dueño es quien envía.
    Publica: conversation.events.v1 (MessageReceived sin cuerpo, MessageSent,
    MessageDelivered, MessageRead, MessageFailed, MessageDeliveryUnknown,
    ContactOptedOut, ContactOptedIn, InboundUnrouted, CommandRejected).
    Consume: ingress.whatsapp.v1, ingress.email.v1, case.events.v1.
    Comandos: conversation.commands.v1 (SendMessage).
  contact:
    name: Equipo Conversación e IA (dueño de conversation-service)
  license:
    name: Propietario
    identifier: LicenseRef-Proprietary
servers:
  - url: http://conversation.receivables.svc.cluster.local
    description: Dentro del clúster (malla con mTLS)
tags:
  - name: Conversations
    description: Conversaciones y mensajes
  - name: Templates
    description: Plantillas y estado de aprobación en Meta
  - name: ChannelPreferences
    description: Preferencias y opt-out por canal
  - name: ChannelAccounts
    description: Cuentas de canal y rutas a tenant
  - name: Internal
    description: Rutas internas (mTLS + token de servicio)
security:
  - contextToken: []
paths:
  /v1/conversations:
    get:
      operationId: listConversations
      tags: [Conversations]
      summary: Lista conversaciones (filtro opcional por caso)
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - name: caseId
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/Uuid'
      responses:
        '200':
          description: Página de conversaciones.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConversationPage'
        '401':
          $ref: '../common/common.yaml#/components/responses/Unauthorized'

  /v1/conversations/{conversationId}/messages:
    get:
      operationId: listMessages
      tags: [Conversations]
      summary: Lista mensajes de una conversación
      parameters:
        - $ref: '#/components/parameters/ConversationId'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - name: direction
          in: query
          required: false
          schema:
            type: string
            enum: [INBOUND, OUTBOUND, INTERNAL]
      responses:
        '200':
          description: Página de mensajes.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessagePage'
        '401':
          $ref: '../common/common.yaml#/components/responses/Unauthorized'
        '404':
          $ref: '../common/common.yaml#/components/responses/NotFound'
    post:
      operationId: sendMessageHuman
      tags: [Conversations]
      summary: Envía un mensaje (humano; pide permiso a case-service)
      description: |
        `Idempotency-Key` obligatoria para envío idempotente. Antes de enviar,
        conversation-service pide un permiso de contacto firmado a
        case-service (fail closed).
      parameters:
        - $ref: '#/components/parameters/ConversationId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MessageSend'
      responses:
        '202':
          description: Mensaje encolado para envío.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageAccepted'
        '401':
          $ref: '../common/common.yaml#/components/responses/Unauthorized'
        '404':
          $ref: '../common/common.yaml#/components/responses/NotFound'
        '409':
          description: Sin permiso de contacto o fuera de ventana.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

  /v1/templates:
    get:
      operationId: listTemplates
      tags: [Templates]
      summary: Lista plantillas y estado de aprobación en Meta
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Página de plantillas.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TemplatePage'
        '401':
          $ref: '../common/common.yaml#/components/responses/Unauthorized'
    post:
      operationId: createTemplate
      tags: [Templates]
      summary: Crea una plantilla (sometida a aprobación de Meta)
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TemplateCreate'
      responses:
        '201':
          description: Plantilla creada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Template'
        '400':
          $ref: '../common/common.yaml#/components/responses/BadRequest'
        '401':
          $ref: '../common/common.yaml#/components/responses/Unauthorized'

  /v1/contacts/{contactId}/channel-preferences:
    get:
      operationId: getChannelPreferences
      tags: [ChannelPreferences]
      summary: Preferencias y opt-out por canal de un contacto
      parameters:
        - $ref: '#/components/parameters/ContactId'
      responses:
        '200':
          description: Preferencias por canal.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChannelPreferences'
        '401':
          $ref: '../common/common.yaml#/components/responses/Unauthorized'
        '404':
          $ref: '../common/common.yaml#/components/responses/NotFound'
    put:
      operationId: putChannelPreferences
      tags: [ChannelPreferences]
      summary: Establece preferencias y opt-out por canal
      parameters:
        - $ref: '#/components/parameters/ContactId'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChannelPreferencesWrite'
      responses:
        '200':
          description: Preferencias actualizadas.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChannelPreferences'
        '401':
          $ref: '../common/common.yaml#/components/responses/Unauthorized'
        '404':
          $ref: '../common/common.yaml#/components/responses/NotFound'
        '409':
          $ref: '../common/common.yaml#/components/responses/PreconditionFailed'

  /v1/channel-accounts:
    get:
      operationId: listChannelAccounts
      tags: [ChannelAccounts]
      summary: Cuentas de canal y sus rutas a tenant
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Página de cuentas de canal.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChannelAccountPage'
        '401':
          $ref: '../common/common.yaml#/components/responses/Unauthorized'

  /internal/v1/messages/{messageId}:
    get:
      operationId: getMessage
      tags: [Internal]
      summary: Cuerpo del mensaje (claim check; exige scope del caso)
      description: |
        Los eventos no llevan el cuerpo; quien lo necesita llama aquí con
        scope del caso. `messageId` en el path.
      x-internal: true
      security:
        - serviceToken: []
      parameters:
        - name: messageId
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/Uuid'
      responses:
        '200':
          description: Mensaje completo.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
        '401':
          $ref: '../common/common.yaml#/components/responses/Unauthorized'
        '404':
          $ref: '../common/common.yaml#/components/responses/NotFound'

  /internal/v1/cases/{caseId}/recent-messages:
    get:
      operationId: getRecentMessages
      tags: [Internal]
      summary: Últimos mensajes de un caso (para el agente)
      x-internal: true
      security:
        - serviceToken: []
      parameters:
        - name: caseId
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/Uuid'
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 20
      responses:
        '200':
          description: Mensajes recientes.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [messages]
                properties:
                  messages:
                    type: array
                    items:
                      $ref: '#/components/schemas/Message'
        '401':
          $ref: '../common/common.yaml#/components/responses/Unauthorized'
        '403':
          $ref: '../common/common.yaml#/components/responses/Forbidden'

  /internal/v1/contacts/{contactId}/reachability:
    get:
      operationId: getReachability
      tags: [Internal]
      summary: Canal, ventana abierta y consentimiento de un contacto
      x-internal: true
      security:
        - serviceToken: []
      parameters:
        - $ref: '#/components/parameters/ContactId'
      responses:
        '200':
          description: Estado de alcanzabilidad.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Reachability'
        '401':
          $ref: '../common/common.yaml#/components/responses/Unauthorized'
        '404':
          $ref: '../common/common.yaml#/components/responses/NotFound'

components:
  securitySchemes:
    contextToken:
      $ref: '../common/common.yaml#/components/securitySchemes/contextToken'
    serviceToken:
      $ref: '../common/common.yaml#/components/securitySchemes/serviceToken'
  parameters:
    ConversationId:
      name: conversationId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
    ContactId:
      name: contactId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
    IdempotencyKey:
      $ref: '../common/common.yaml#/components/parameters/IdempotencyKey'
    IfMatch:
      $ref: '../common/common.yaml#/components/parameters/IfMatch'
    Cursor:
      $ref: '../common/common.yaml#/components/parameters/Cursor'
    Limit:
      $ref: '../common/common.yaml#/components/parameters/Limit'
  schemas:
    Uuid:
      $ref: '../common/common.yaml#/components/schemas/Uuid'
    Actor:
      $ref: '../common/common.yaml#/components/schemas/Actor'
    PageInfo:
      $ref: '../common/common.yaml#/components/schemas/PageInfo'
    Problem:
      $ref: '../common/common.yaml#/components/schemas/Problem'
    Conversation:
      type: object
      additionalProperties: false
      required: [conversationId, caseId, channel, status]
      properties:
        conversationId:
          $ref: '#/components/schemas/Uuid'
        caseId:
          $ref: '#/components/schemas/Uuid'
        contactId:
          $ref: '#/components/schemas/Uuid'
        channel:
          type: string
          enum: [WHATSAPP, PHONE, EMAIL, MESSENGER, IN_APP]
        status:
          type: string
          enum: [ACTIVE, PAUSED, CLOSED]
        windowOpenUntil:
          type: string
          format: date-time
          description: Cierre de la ventana de 24 h.
    ConversationPage:
      type: object
      additionalProperties: false
      required: [items, pageInfo]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Conversation'
        pageInfo:
          $ref: '#/components/schemas/PageInfo'
    Message:
      type: object
      additionalProperties: false
      required: [messageId, conversationId, caseId, direction, status]
      properties:
        messageId:
          $ref: '#/components/schemas/Uuid'
        conversationId:
          $ref: '#/components/schemas/Uuid'
        caseId:
          $ref: '#/components/schemas/Uuid'
        contactId:
          $ref: '#/components/schemas/Uuid'
        direction:
          type: string
          enum: [INBOUND, OUTBOUND, INTERNAL]
        channel:
          type: string
          enum: [WHATSAPP, PHONE, EMAIL, MESSENGER, IN_APP]
        body:
          type: string
          maxLength: 4096
        templateName:
          type: string
          maxLength: 200
        status:
          type: string
          enum: [QUEUED, SENT, DELIVERED, READ, FAILED, DELIVERY_UNKNOWN]
        sender:
          $ref: '#/components/schemas/Actor'
        sentAt:
          type: string
          format: date-time
    MessagePage:
      type: object
      additionalProperties: false
      required: [items, pageInfo]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Message'
        pageInfo:
          $ref: '#/components/schemas/PageInfo'
    MessageSend:
      type: object
      additionalProperties: false
      required: [direction, channel]
      properties:
        direction:
          type: string
          enum: [OUTBOUND, INTERNAL]
        channel:
          type: string
          enum: [WHATSAPP, PHONE, EMAIL, MESSENGER, IN_APP]
        body:
          type: string
          maxLength: 4096
        templateName:
          type: string
          maxLength: 200
        params:
          type: object
          additionalProperties:
            type: string
    MessageAccepted:
      type: object
      additionalProperties: false
      required: [messageId, status]
      properties:
        messageId:
          $ref: '#/components/schemas/Uuid'
        status:
          type: string
          enum: [QUEUED, SENT]
    Template:
      type: object
      additionalProperties: false
      required: [templateId, name, category, approvalStatus]
      properties:
        templateId:
          $ref: '#/components/schemas/Uuid'
        name:
          type: string
          maxLength: 200
        category:
          type: string
          enum: [UTILITY, MARKETING, AUTHENTICATION]
        approvalStatus:
          type: string
          enum: [DRAFT, PENDING, APPROVED, REJECTED, DISAPPROVED]
        language:
          type: string
          examples: [es]
    TemplateCreate:
      type: object
      additionalProperties: false
      required: [name, category, language]
      properties:
        name:
          type: string
          maxLength: 200
        category:
          type: string
          enum: [UTILITY, MARKETING, AUTHENTICATION]
        language:
          type: string
          examples: [es]
        body:
          type: string
          maxLength: 1024
    TemplatePage:
      type: object
      additionalProperties: false
      required: [items, pageInfo]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Template'
        pageInfo:
          $ref: '#/components/schemas/PageInfo'
    ChannelPreference:
      type: object
      additionalProperties: false
      required: [channel, optedOut]
      properties:
        channel:
          type: string
          enum: [WHATSAPP, PHONE, EMAIL, MESSENGER, IN_APP]
        optedOut:
          type: boolean
        preferred:
          type: boolean
          default: false
        quietHours:
          type: object
          additionalProperties: false
          properties:
            start:
              type: string
            end:
              type: string
        optedOutAt:
          type: string
          format: date-time
    ChannelPreferences:
      type: object
      additionalProperties: false
      required: [contactId, preferences]
      properties:
        contactId:
          $ref: '#/components/schemas/Uuid'
        preferences:
          type: array
          items:
            $ref: '#/components/schemas/ChannelPreference'
    ChannelPreferencesWrite:
      type: object
      additionalProperties: false
      required: [preferences]
      properties:
        preferences:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/ChannelPreference'
    ChannelAccount:
      type: object
      additionalProperties: false
      required: [channelAccountId, channel, status]
      properties:
        channelAccountId:
          $ref: '#/components/schemas/Uuid'
        channel:
          type: string
          enum: [WHATSAPP, PHONE, EMAIL, MESSENGER, IN_APP]
        providerAccountId:
          type: string
          maxLength: 256
        status:
          type: string
          enum: [ACTIVE, SUSPENDED, DELETED]
    ChannelAccountPage:
      type: object
      additionalProperties: false
      required: [items, pageInfo]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ChannelAccount'
        pageInfo:
          $ref: '#/components/schemas/PageInfo'
    Reachability:
      type: object
      additionalProperties: false
      required: [contactId, reachable, windowOpen, consent]
      properties:
        contactId:
          $ref: '#/components/schemas/Uuid'
        reachable:
          type: boolean
        channel:
          type: string
          enum: [WHATSAPP, PHONE, EMAIL, MESSENGER, IN_APP]
        windowOpen:
          type: boolean
        windowOpenUntil:
          type: string
          format: date-time
        consent:
          type: string
          enum: [GRANTED, OPTED_OUT, UNKNOWN]
